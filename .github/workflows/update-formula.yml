# Mantiene Formula/xtal.rb y Casks/xtal-app.rb apuntando a la última Release de
# mcorcos/xtal: la CLI y la app de escritorio de macOS, que se publican juntas y
# van clavadas a la misma version.
#
# ¿Por qué el tap se actualiza solo en vez de que el repo principal le pushee la
# fórmula? Porque escribir desde otro repositorio necesita un Personal Access Token
# guardado como secret, y un token con permiso de escritura viviendo en los secrets de
# un repo público es un riesgo que este proyecto no necesita correr. Mirando la Release
# desde acá, el GITHUB_TOKEN del propio repo alcanza y no hay ningún secret que cuidar.
#
# El costo es que la fórmula puede tardar hasta una hora en reflejar una Release nueva.
# Para que salga ya, se dispara el workflow a mano (Actions -> Run workflow).
name: Actualizar la fórmula y el cask

on:
  schedule:
    # A y 17 de cada hora. GitHub puede demorar los schedules unos minutos: no importa.
    - cron: "17 * * * *"
  workflow_dispatch:
  # Permite que el repo principal lo dispare, si algún día se carga un token allá.
  repository_dispatch:
    types: [xtal-release]

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    name: regenerar la fórmula y el cask
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolver la última version publicada
        id: v
        run: |
          set -euo pipefail
          # La respuesta se guarda ENTERA antes de filtrarla. Con `curl | grep -m1`,
          # grep cierra el pipe al primer match, curl muere con SIGPIPE y `pipefail`
          # hace fallar el paso aunque la descarga haya estado bien.
          JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' \
                  https://api.github.com/repos/mcorcos/xtal/releases/latest)"
          TAG="$(printf '%s' "$JSON" \
                 | grep '"tag_name"' | head -1 \
                 | sed -E 's/.*"tag_name" *: *"([^"]+)".*/\1/')"
          if [ -z "$TAG" ]; then
            echo "::error::No pude resolver la última Release de mcorcos/xtal."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Última version publicada: ${TAG}"

      - name: Renderizar la fórmula y el cask
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # Las plantillas viven en el repo principal: un solo lugar donde tocarlas.
          BASE=https://raw.githubusercontent.com/mcorcos/xtal/main/packaging/homebrew
          curl -fsSL -o /tmp/render-formula.sh "$BASE/render-formula.sh"
          curl -fsSL -o /tmp/render-cask.sh    "$BASE/render-cask.sh"

          mkdir -p Formula Casks
          bash /tmp/render-formula.sh "$VERSION" --from-release > Formula/xtal.rb
          cat Formula/xtal.rb

          # La app de macOS empezó a publicarse después que la CLI: en una Release
          # vieja su zip no existe y el script corta. Eso NO puede tumbar la
          # actualización de la fórmula, que es lo que instala casi todo el mundo.
          # Si el zip no está, se avisa y se sigue con el cask que ya había.
          if bash /tmp/render-cask.sh "$VERSION" --from-release > /tmp/xtal-app.rb; then
            mv /tmp/xtal-app.rb Casks/xtal-app.rb
            cat Casks/xtal-app.rb
          else
            echo "::warning::La Release v$VERSION no publica el zip de la app de macOS: dejo el cask como estaba."
          fi

      - name: Commitear si cambió algo
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/xtal.rb Casks/xtal-app.rb 2>/dev/null || git add Formula/xtal.rb
          # Si ya apuntaban a esta version, no hay nada que commitear.
          if git diff --staged --quiet; then
            echo "La fórmula y el cask ya están en ${VERSION}: no hago nada."
            exit 0
          fi
          git commit -m "xtal ${VERSION}"
          git push
